<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name='impact-site-verification' value='c5445e5f-e5a7-4963-a659-5fd78ecfaaaf'>
    <title>Secure Connection | Privacy Check</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .status-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }
        .pulse-ring {
            border: 3px solid #ff4444;
            border-radius: 50%;
            height: 72px;
            width: 72px;
            position: absolute;
            animation: pulsate 1.8s ease-out infinite;
            opacity: 0;
        }
        .status-icon {
            background-color: #21262d;
            border: 2px solid #ff4444;
            border-radius: 50%;
            height: 72px;
            width: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .status-icon svg {
            width: 32px;
            height: 32px;
            fill: #ff4444;
        }
        @keyframes pulsate {
            0% {transform: scale(0.6, 0.6); opacity: 0.0;}
            50% {opacity: 1.0;}
            100% {transform: scale(1.2, 1.2); opacity: 0.0;}
        }
        .alert-badge {
            background-color: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h1 {
            color: #f0f6fc;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #094cb5 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 16px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(31, 111, 235, 0.3);
        }
        .btn:hover {
            background: linear-gradient(135deg, #388bfd 0%, #1f6feb 100%);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-container">
            <div class="pulse-ring"></div>
            <div class="status-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
            </div>
        </div>

        <div>
            <span class="alert-badge">Unsecure Connection</span>
        </div>

        <h1>Protect Your Privacy</h1>
        <p>Your network traffic and browsing activity are currently visible to external trackers and your service provider. Enable encryption to hide your history immediately.</p>

        <a href="https://www.google.com" class="btn">Proceed Securely</a>

        <div class="footer-note">
            Secure Encrypted Tunnel Connection • Zero Logs Policy
        </div>
    </div>

</body>
</html>
